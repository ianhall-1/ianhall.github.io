<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ian Hall | Photo Gallery</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;

            background-image: url("background.jpeg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            color: #222;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 20px;

            background-color: rgba(19, 19, 19, 0.95);

            padding: 15px;

            position: fixed;
            top: 0;
            left: 0;

            width: 100%;

            box-sizing: border-box;

            z-index: 1000;
        }

        nav a {
            background: white;
            color: black;

            padding: 10px 20px;

            border-radius: 20px;

            text-decoration: none;

            font-weight: bold;

            transition: 0.3s;
        }

        nav a:hover {
            background: #292a2b;
            color: white;

            transform: scale(1.08);
        }

        .gallery-page {
            padding: 120px 20px 60px;
        }

        .gallery-box {
            max-width: 1100px;

            margin: auto;

            background: rgba(255, 255, 255, 0.92);

            padding: 40px;

            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;

            font-size: 40px;

            margin-top: 0;
        }

        .intro {
            text-align: center;

            font-size: 18px;

            margin-bottom: 40px;
        }

        .gallery-container {
            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

            gap: 20px;
        }

        .gallery-container img {
            width: 100%;
            height: 220px;

            object-fit: cover;

            border-radius: 10px;

            box-shadow: 0 3px 12px rgba(0,0,0,0.2);

            transition: 0.3s;
        }

        .gallery-container img:hover {
            transform: scale(1.04);
        }

        footer {
            background: #131313;

            color: white;

            text-align: center;

            padding: 25px;
        }

    </style>
</head>


<body>

    <nav>

        <a href="index.html">Home</a>

        <a href="index.html#about">About Me</a>

        <a href="projects.html">Projects</a>

        <a href="gallery.html">Photo Gallery</a>

        <a href="index.html#contact">Contact</a>

    </nav>


    <div class="gallery-page">

        <div class="gallery-box">

            <h1>Photo Gallery</h1>

            <p class="intro">
                A collection of some of my photography.
                Click any image to view it full size.
            </p>


            <div class="gallery-container">

                <a href="photo1.jpeg" target="_blank">
                    <img src="photo1.jpeg" alt="Photography by Ian Hall">
                </a>

                <a href="photo2.jpeg" target="_blank">
                    <img src="photo2.jpeg" alt="Photography by Ian Hall">
                </a>

                <a href="photo3.jpeg" target="_blank">
                    <img src="photo3.jpeg" alt="Photography by Ian Hall">
                </a>

                <a href="photo4.jpeg" target="_blank">
                    <img src="photo4.jpeg" alt="Photography by Ian Hall">
                </a>

            </div>

        </div>

    </div>


    <footer>

        © 2026 Ian Hall | Mechanical Engineering Portfolio

    </footer>

</body>

</html>
